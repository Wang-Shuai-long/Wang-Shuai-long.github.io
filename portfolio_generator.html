<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人作品集生成器 | Portfolio Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .top-bar {
            background: rgba(10, 14, 23, 0.95);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .top-bar h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar h1 span { color: #00d4ff; }
        .top-actions { display: flex; gap: 10px; }
        .btn {
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: #1a2332;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { border-color: #00d4ff; color: #00d4ff; }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            color: #0a0e17;
            border: none;
            font-weight: 600;
        }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); color: #0a0e17; }
        .main-layout { display: flex; height: calc(100vh - 57px); }
        .config-panel {
            width: 420px;
            min-width: 420px;
            background: #111827;
            border-right: 1px solid rgba(148, 163, 184, 0.1);
            overflow-y: auto;
            padding: 20px;
        }
        .config-section {
            margin-bottom: 24px;
            background: #1a2332;
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        .config-section-header {
            padding: 14px 18px;
            background: rgba(0, 212, 255, 0.05);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }
        .config-section-header h3 { font-size: 0.95rem; flex: 1; }
        .config-section-header .toggle-icon { transition: transform 0.2s; color: #64748b; }
        .config-section-header.collapsed .toggle-icon { transform: rotate(-90deg); }
        .config-section-body { padding: 18px; }
        .config-section-body.hidden { display: none; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: #0a0e17;
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .dynamic-list { display: flex; flex-direction: column; gap: 12px; }
        .dynamic-item {
            background: #0a0e17;
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 10px;
            padding: 14px;
            position: relative;
        }
        .dynamic-item .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 1.1rem;
        }
        .dynamic-item .remove-btn:hover { color: #ff6b6b; background: rgba(255, 107, 107, 0.1); }
        .add-btn {
            width: 100%;
            padding: 10px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px dashed rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .add-btn:hover { background: rgba(0, 212, 255, 0.1); border-style: solid; }
        .skill-input {
            display: grid;
            grid-template-columns: 130px 1fr 50px 28px;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .skill-input input[type="text"] { width: 100%; }
        .skill-input input[type="number"] { width: 60px; }
        .skill-input input[type="range"] { width: 100%; }
        .skill-percent {
            text-align: right;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #00d4ff;
            white-space: nowrap;
        }
        .preview-panel { flex: 1; overflow: auto; background: #0a0e17; }
        .preview-panel iframe { width: 100%; height: 100%; border: none; }
        .theme-selector { display: flex; gap: 10px; flex-wrap: wrap; padding-bottom: 20px; }
        .theme-option {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        .theme-option:hover { transform: scale(1.1); }
        .theme-option.active { border-color: #fff; box-shadow: 0 0 0 2px #00d4ff; }
        .theme-option::after {
            content: attr(data-name);
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            white-space: nowrap;
            color: #94a3b8;
        }
        .ai-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .ai-toggle label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #334155;
            border-radius: 24px;
            transition: 0.3s;
        }
        .slider::before {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .switch input:checked + .slider { background: #00d4ff; }
        .switch input:checked + .slider::before { transform: translateX(20px); }
        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; }
            .config-panel { width: 100%; min-width: auto; max-height: 50vh; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1><span>&#129302;</span> 个人作品集生成器</h1>
        <div class="top-actions">
            <button class="btn" onclick="importJSON()">&#128194; 导入配置</button>
            <button class="btn" onclick="exportJSON()">&#128190; 导出配置</button>
            <button class="btn btn-primary" onclick="exportHTML()">&#11015; 生成作品集</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="config-panel">
            <!-- 配色方案 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#127912; 配色方案</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div class="theme-selector">
                        <div class="theme-option active" data-name="科技蓝" data-theme="tech" style="background: linear-gradient(135deg, #00d4ff, #7b61ff);" onclick="selectTheme('tech', this)"></div>
                        <div class="theme-option" data-name="活力橙" data-theme="orange" style="background: linear-gradient(135deg, #ff6b35, #ff9f1c);" onclick="selectTheme('orange', this)"></div>
                        <div class="theme-option" data-name="专业紫" data-theme="purple" style="background: linear-gradient(135deg, #7b61ff, #a855f7);" onclick="selectTheme('purple', this)"></div>
                        <div class="theme-option" data-name="清新绿" data-theme="green" style="background: linear-gradient(135deg, #10b981, #34d399);" onclick="selectTheme('green', this)"></div>
                    </div>
                </div>
            </div>

            <!-- 基本信息 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#128100; 基本信息</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="name" placeholder="你的名字" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>专业/方向</label>
                        <input type="text" id="major" placeholder="如：物联网应用技术" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>个人简介</label>
                        <textarea id="bio" placeholder="描述你的定位和追求..." oninput="updatePreview()"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>在校年限</label>
                            <input type="number" id="years" placeholder="3" oninput="updatePreview()">
                        </div>
                        <div class="form-group">
                            <label>项目数量</label>
                            <input type="number" id="projects" placeholder="5" oninput="updatePreview()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 教育背景 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#127891; 教育背景</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div class="form-group">
                        <label>学校名称</label>
                        <input type="text" id="school" placeholder="你的学校" oninput="updatePreview()">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>学历</label>
                            <select id="degree" onchange="updatePreview()">
                                <option value="专科">专科</option>
                                <option value="本科">本科</option>
                                <option value="硕士">硕士</option>
                                <option value="博士">博士</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>时间段</label>
                            <input type="text" id="eduTime" placeholder="2023.09 - 2026.06" oninput="updatePreview()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>GPA</label>
                        <input type="text" id="gpa" placeholder="3.8/4.0" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>主修课程（逗号分隔）</label>
                        <textarea id="courses" placeholder="C语言程序设计, 嵌入式系统, 传感器技术..." oninput="updatePreview()"></textarea>
                    </div>
                </div>
            </div>

            <!-- 技能清单 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#128295; 技能清单</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div id="skillCategories"></div>
                    <button class="add-btn" onclick="addSkillCategory()">+ 添加技能分类</button>
                </div>
            </div>

            <!-- 项目经历 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#128187; 项目经历</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div id="projectsList" class="dynamic-list"></div>
                    <button class="add-btn" onclick="addProject()">+ 添加项目</button>
                </div>
            </div>

            <!-- 竞赛与经历 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#127942; 竞赛与经历</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div id="timelineList" class="dynamic-list"></div>
                    <button class="add-btn" onclick="addTimeline()">+ 添加经历</button>
                </div>
            </div>

            <!-- 联系方式 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#9742; 联系方式</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="email" placeholder="your@email.com" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>GitHub 用户名</label>
                        <input type="text" id="github" placeholder="username" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>微信/其他</label>
                        <input type="text" id="wechat" placeholder="微信号或备注" oninput="updatePreview()">
                    </div>
                </div>
            </div>

            <!-- AI 能力评估 -->
            <div class="config-section">
                <div class="config-section-header" onclick="toggleSection(this)">
                    <h3>&#129302; AI 能力评估</h3>
                    <span class="toggle-icon">&#9662;</span>
                </div>
                <div class="config-section-body">
                    <div class="ai-toggle">
                        <label class="switch">
                            <input type="checkbox" id="aiEnabled" onchange="toggleAI()">
                            <span class="slider"></span>
                        </label>
                        <span>在作品中显示 AI 评估模块</span>
                    </div>
                    <div id="aiSkillsConfig" style="display:none;">
                        <div class="form-group">
                            <label>AI 分析的技能维度（每行一个：技能名,匹配百分比）</label>
                            <textarea id="aiSkills" rows="5" placeholder="嵌入式开发,92&#10;物联网系统,88&#10;全栈开发,72" oninput="updatePreview()"></textarea>
                        </div>
                        <div class="form-group">
                            <label>AI 洞察分析（每段一行）</label>
                            <textarea id="aiInsights" rows="4" placeholder="优势领域：你在...方面展现出扎实的能力...&#10;成长空间：建议在...方向加强学习..." oninput="updatePreview()"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="preview-panel">
            <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-popups allow-modals"></iframe>
        </div>
    </div>

    <script>
    // ============ 数据管理 ============
    var config = {
        theme: 'tech',
        name: '',
        major: '',
        bio: '',
        years: 3,
        projectCount: 5,
        school: '',
        degree: '专科',
        eduTime: '',
        gpa: '3.8/4.0',
        courses: '',
        skills: [{ name: '编程语言', items: [{ name: 'C/C++', level: 85 }, { name: 'Python', level: 80 }] }],
        projects: [],
        timeline: [],
        email: '',
        github: '',
        wechat: '',
        aiEnabled: false,
        aiSkills: '',
        aiInsights: ''
    };

    var themes = {
        tech:   { primary: '#00d4ff', secondary: '#7b61ff', accent: '#00ff88', gradient: 'linear-gradient(135deg, #00d4ff, #7b61ff)' },
        orange: { primary: '#ff6b35', secondary: '#ff9f1c', accent: '#ffb347', gradient: 'linear-gradient(135deg, #ff6b35, #ff9f1c)' },
        purple: { primary: '#7b61ff', secondary: '#a855f7', accent: '#c084fc', gradient: 'linear-gradient(135deg, #7b61ff, #a855f7)' },
        green:  { primary: '#10b981', secondary: '#34d399', accent: '#6ee7b7', gradient: 'linear-gradient(135deg, #10b981, #34d399)' }
    };

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function toggleSection(header) {
        header.classList.toggle('collapsed');
        var body = header.nextElementSibling;
        body.classList.toggle('hidden');
    }

    function selectTheme(theme, el) {
        config.theme = theme;
        document.querySelectorAll('.theme-option').forEach(function(o) { o.classList.remove('active'); });
        el.classList.add('active');
        updatePreview();
    }

    function toggleAI() {
        var checked = document.getElementById('aiEnabled').checked;
        document.getElementById('aiSkillsConfig').style.display = checked ? 'block' : 'none';
        updatePreview();
    }

    // ============ 技能管理 ============
    function renderSkillCategories() {
        var container = document.getElementById('skillCategories');
        var html = config.skills.map(function(cat, ci) {
            var itemsHTML = cat.items.map(function(item, ii) {
                return '<div class="skill-input">' +
                    '<input type="text" value="' + escapeHtml(item.name) + '" onchange="updateSkillItem(' + ci + ',' + ii + ',\'name\',this.value)" placeholder="技能名">' +
                    '<input type="range" min="0" max="100" value="' + item.level + '" oninput="updateSkillItem(' + ci + ',' + ii + ',\'level\',this.value); this.parentElement.querySelector(\'.skill-percent\').textContent = this.value + \'%\'">' +
                    '<span class="skill-percent">' + item.level + '%</span>' +
                    '<button class="remove-btn" style="position:static;padding:2px 6px;font-size:1rem;" onclick="removeSkillItem(' + ci + ',' + ii + ')">&times;</button>' +
                '</div>';
            }).join('');
            return '<div class="dynamic-item">' +
                '<button class="remove-btn" onclick="removeSkillCategory(' + ci + ')">&times;</button>' +
                '<div class="form-group"><label>分类名称</label>' +
                '<input type="text" value="' + escapeHtml(cat.name) + '" onchange="updateSkillCategory(' + ci + ',\'name\',this.value)" placeholder="如：编程语言">' +
                '</div>' +
                '<div style="margin-top:10px;">' + itemsHTML +
                '<button class="add-btn" style="margin-top:6px;padding:6px;" onclick="addSkillItem(' + ci + ')">+ 添加技能</button>' +
                '</div></div>';
        }).join('');
        container.innerHTML = html;
    }

    function addSkillCategory() {
        config.skills.push({ name: '新分类', items: [{ name: '', level: 50 }] });
        renderSkillCategories();
        updatePreview();
    }
    function removeSkillCategory(index) {
        config.skills.splice(index, 1);
        renderSkillCategories();
        updatePreview();
    }
    function updateSkillCategory(ci, field, value) {
        config.skills[ci][field] = value;
        updatePreview();
    }
    function addSkillItem(ci) {
        config.skills[ci].items.push({ name: '', level: 50 });
        renderSkillCategories();
        updatePreview();
    }
    function removeSkillItem(ci, ii) {
        config.skills[ci].items.splice(ii, 1);
        renderSkillCategories();
        updatePreview();
    }
    function updateSkillItem(ci, ii, field, value) {
        config.skills[ci].items[ii][field] = field === 'level' ? parseInt(value) : value;
        updatePreview();
    }

    // ============ 项目管理 ============
    function renderProjects() {
        var container = document.getElementById('projectsList');
        var html = config.projects.map(function(proj, i) {
            return '<div class="dynamic-item">' +
                '<button class="remove-btn" onclick="removeProject(' + i + ')">&times;</button>' +
                '<div class="form-row">' +
                '<div class="form-group"><label>项目名称</label>' +
                '<input type="text" value="' + escapeHtml(proj.title) + '" onchange="updateProject(' + i + ',\'title\',this.value)" placeholder="项目标题">' +
                '</div>' +
                '<div class="form-group"><label>时间</label>' +
                '<input type="text" value="' + escapeHtml(proj.time) + '" onchange="updateProject(' + i + ',\'time\',this.value)" placeholder="2024.03 - 2024.06">' +
                '</div></div>' +
                '<div class="form-group"><label>项目描述</label>' +
                '<textarea onchange="updateProject(' + i + ',\'desc\',this.value)" placeholder="描述项目内容、技术栈、你的贡献...">' + escapeHtml(proj.desc) + '</textarea>' +
                '</div>' +
                '<div class="form-group"><label>技术标签（逗号分隔）</label>' +
                '<input type="text" value="' + escapeHtml(proj.tags) + '" onchange="updateProject(' + i + ',\'tags\',this.value)" placeholder="STM32, ESP8266, MQTT">' +
                '</div>' +
                '<div class="form-group"><label>图标（emoji或文字）</label>' +
                '<input type="text" value="' + escapeHtml(proj.icon) + '" onchange="updateProject(' + i + ',\'icon\',this.value)" placeholder="&#9881;">' +
                '</div></div>';
        }).join('');
        container.innerHTML = html;
    }

    function addProject() {
        config.projects.push({ title: '', time: '', desc: '', tags: '', icon: '\u2699' });
        renderProjects();
        updatePreview();
    }
    function removeProject(i) {
        config.projects.splice(i, 1);
        renderProjects();
        updatePreview();
    }
    function updateProject(i, field, value) {
        config.projects[i][field] = value;
        updatePreview();
    }

    // ============ 时间线管理 ============
    function renderTimeline() {
        var container = document.getElementById('timelineList');
        var types = [
            { value: 'award', label: '竞赛获奖' },
            { value: 'intern', label: '实习经历' },
            { value: 'activity', label: '社团活动' },
            { value: 'other', label: '其他' }
        ];
        var html = config.timeline.map(function(item, i) {
            var optionsHTML = types.map(function(t) {
                return '<option value="' + t.value + '"' + (item.type === t.value ? ' selected' : '') + '>' + t.label + '</option>';
            }).join('');
            return '<div class="dynamic-item">' +
                '<button class="remove-btn" onclick="removeTimeline(' + i + ')">&times;</button>' +
                '<div class="form-row">' +
                '<div class="form-group"><label>标题</label>' +
                '<input type="text" value="' + escapeHtml(item.title) + '" onchange="updateTimeline(' + i + ',\'title\',this.value)" placeholder="经历标题">' +
                '</div>' +
                '<div class="form-group"><label>时间</label>' +
                '<input type="text" value="' + escapeHtml(item.time) + '" onchange="updateTimeline(' + i + ',\'time\',this.value)" placeholder="2024.12">' +
                '</div></div>' +
                '<div class="form-group"><label>描述</label>' +

    // ============ 更新预览（使用 srcdoc 避免 doc.write 问题） ============
    function updatePreview() {
        collectConfig();
        var html = buildPreviewHTML();
        var iframe = document.getElementById('previewFrame');
        iframe.srcdoc = html;
    }

    // ============ 导出HTML ============
    function exportHTML() {
        collectConfig();
        var html = buildPreviewHTML();
        var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = (config.name || 'portfolio') + '_portfolio.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    function exportJSON() {
        collectConfig();
        var blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'portfolio_config.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function importJSON() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(event) {
                try {
                    var data = JSON.parse(event.target.result);
                    Object.assign(config, data);
                    saveToStorage();
                    location.reload();
                } catch(err) {
                    alert('配置文件格式错误');
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // ============ 初始化 ============
    function init() {
        loadFromStorage();
        renderSkillCategories();
        renderProjects();
        renderTimeline();
        updatePreview();
    }

    init();
    </script>
